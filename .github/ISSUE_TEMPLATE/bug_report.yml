name: "Report a problem / 报告问题"
description: "Something is not working. / 遇到使用问题。"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Practice Studio! 欢迎反馈，可以使用中文或英文。
        This issue is public. Do not upload complete question banks, essays, recordings or personal information.
        此处内容公开，请勿上传完整题库、作文、录音或个人信息。截图请先遮挡敏感内容。
  - type: textarea
    id: summary
    attributes:
      label: "What happened? / 发生了什么？"
      description: "Describe the problem and what you expected. / 描述实际情况和预期结果。"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "Steps to reproduce / 如何重现"
      description: "List the steps, starting from opening the app. / 从打开平台开始，按顺序描述操作步骤。"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "System information / 系统信息"
      description: "App version, OS and browser. Copy from the app feedback window; edit as needed. / 可从平台反馈窗口复制，并自行修改。"
      placeholder: "Practice Studio version, Windows/macOS/Linux, browser"
  - type: textarea
    id: extra
    attributes:
      label: "Additional context / 补充说明"
      description: "Optional redacted screenshots or an original minimal example. / 可选：遮挡隐私后的截图或自编最小示例。"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Before submitting / 提交前确认"
      options:
        - label: "I have removed personal/private or copyrighted materials I cannot share. / 我已移除不宜公开的个人信息及无权分享的材料。"
          required: true
